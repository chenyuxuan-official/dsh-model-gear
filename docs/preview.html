<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-model-gear 面板预览</title>
<link rel="stylesheet" href="../src/style.css">
<style>
  /* Gallery frame only. Everything inside .cg-model-popover is painted by src/style.css. */
  html, body { margin: 0; padding: 0; background: #f7f7f8; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .gallery { display: flex; flex-direction: column; gap: 48px; padding: 32px; align-items: flex-start; }
  /* Render at 2× so the PNG stays crisp when GitHub downscales it. The box is sized for the scaled
     panel: a transform does not grow the layout, so each shot keeps its own reserved area. */
  .gallery { gap: 0; }
  .shot { width: 560px; height: 560px; }
  .shot .cg-model-popover { transform: scale(2); transform-origin: top left; }
  /* The host anchors the popover above the composer trigger; in this static page there is no trigger,
     so the panel is laid out in flow instead of being absolutely positioned. */
  .shot .cg-model-popover {
    position: relative !important;
    inset: auto !important;
    right: auto !important;
    bottom: auto !important;
    animation: none !important;
  }
</style>
</head>
<body>
<div class="gallery">

  <!-- ---------------------------------------------------------------- 强度面板 -->
  <div class="shot" id="shot-effort">
    <div class="cg-model-root" data-effort="max">
      <div class="cg-model-popover" role="dialog" aria-label="模型与推理强度" data-effort="max" data-ultra="true">
        <div class="cg-model-pane">
          <div class="cg-model-top">
            <button class="cg-model-zap" type="button" data-on="false" data-mode="unknown" aria-expanded="false" aria-label="编排档位：标准，点击更换">
              <svg class="cg-model-zap-glyph" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <path d="M13 2 4.5 13.2h6L10 22l8.5-11.2h-6L13 2Z"/>
              </svg>
            </button>
            <button class="cg-model-summary" type="button" aria-label="更换模型">
              <strong>Ultra</strong>
              <span class="cg-model-summary-name">GPT-6.1 Sol
                <svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
              </span>
            </button>
            <button class="cg-model-reset" type="button" aria-label="恢复默认强度">
              <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/>
              </svg>
              <span class="cg-model-tooltip" role="tooltip">重置为默认</span>
            </button>
          </div>
          <div class="cg-model-slider-shell" data-effort="max"
               style="--cg-fill-width: calc(24px + (100% - 24px) * 1); --cg-meteor-travel: 300px">
            <div class="cg-model-slider-fill" style="width: calc(24px + (100% - 24px) * 1)"></div>
            <span class="cg-model-meteors" aria-hidden="true">
              <span class="cg-model-meteor"></span><span class="cg-model-meteor"></span><span class="cg-model-meteor"></span>
              <span class="cg-model-meteor"></span><span class="cg-model-meteor"></span><span class="cg-model-meteor"></span>
              <span class="cg-model-meteor"></span><span class="cg-model-meteor"></span><span class="cg-model-meteor"></span>
              <span class="cg-model-meteor"></span><span class="cg-model-meteor"></span>
            </span>
            <div class="cg-model-slider-dots" aria-hidden="true">
              <span data-on="true"></span><span data-on="true"></span><span data-on="true"></span>
              <span data-on="true"></span><span data-on="true"></span>
            </div>
            <span class="cg-model-thumb" aria-hidden="true" style="translate: calc(12px + (100cqw - 24px) * 1) 0 0"></span>
            <input class="cg-model-slider" type="range" min="0" max="4" step="1" value="4" aria-label="推理强度" aria-valuetext="Ultra">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------------------------------------------- 编排档位 -->
  <div class="shot" id="shot-gear">
    <div class="cg-model-root" data-effort="max" data-superfast="false">
      <div class="cg-model-popover" role="dialog" aria-label="编排档位" data-effort="max" data-ultra="true">
        <div class="cg-model-pane">
          <div class="cg-model-top">
            <button class="cg-model-zap" type="button" data-on="true" data-mode="fast" aria-expanded="true" aria-label="编排档位：快速，点击返回">
              <svg class="cg-model-zap-glyph" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <path d="M13 2 4.5 13.2h6L10 22l8.5-11.2h-6L13 2Z"/>
              </svg>
            </button>
            <button class="cg-model-summary" type="button" aria-label="更换模型">
              <strong>Ultra</strong>
              <span class="cg-model-summary-name">GPT-6.1 Sol
                <svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
              </span>
            </button>
            <button class="cg-model-reset" type="button" aria-label="恢复默认强度">
              <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/>
              </svg>
            </button>
          </div>
          <div class="cg-model-modes" role="menu" aria-label="编排档位">
            <button class="cg-model-mode" type="button" role="menuitemradio" aria-checked="false" data-on="false" data-mode="off">
              <span class="cg-model-mode-text"><strong>标准</strong><span>默认速度</span></span>
              <span class="cg-model-mode-check" aria-hidden="true"></span>
            </button>
            <button class="cg-model-mode" type="button" role="menuitemradio" aria-checked="true" data-on="true" data-mode="fast">
              <span class="cg-model-mode-text"><strong>快速</strong><span>至少 1.5× 消耗 甚至更多</span></span>
              <span class="cg-model-mode-check" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 6.5"/></svg>
              </span>
            </button>
            <button class="cg-model-mode" type="button" role="menuitemradio" aria-checked="false" data-on="false" data-mode="tree">
              <span class="cg-model-mode-text"><strong>超快</strong><span>至少 2.5× token 消耗 甚至更多</span></span>
              <span class="cg-model-mode-check" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
