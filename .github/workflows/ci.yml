name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the client bundle
        run: node scripts/build.mjs
      - name: The committed bundle must match the sources
        run: git diff --exit-code -- lib
      - name: Tests
        run: npm test
